name: Setup Python CI environment
description: Configure Python, verify lockfile version, and install project dependencies.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"
  working-directory:
    description: Directory containing the Python project (Makefile, requirements files, pyproject.toml).
    required: false
    default: "backend"
runs:
  using: composite
  steps:
    - name: Use Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.working-directory }}/requirements*.txt

    - name: Verify lockfiles were generated with Python 3.12
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make check-lock-python-version

    - name: Install deps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
